# wg-quick style config; wg-quick keys (Address/DNS/MTU/Table/hooks) are
# applied by nsm helper wg, the rest goes to wg setconf verbatim.
[Interface]
PrivateKey = <private key>
Address = 10.7.0.2/32
MTU = 1370

[Peer]
PublicKey = <server public key>
Endpoint = vpn.example.org:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
